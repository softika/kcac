# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kcac

before:
  hooks:
    # download, not tidy: a release must build the committed source, not a
    # version go.mod was edited into on the way past.
    - go mod download

builds:
  - id: kcac
    main: ./cmd/kcac
    binary: kcac
    env:
      # Static binaries, so one artifact runs on any glibc or musl system.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: kcac
    formats: [tar.gz]
    # Named to match `uname -s` and `uname -m`, which keeps install.sh to a
    # couple of lines instead of a translation table.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

homebrew_casks:
  - name: kcac
    repository:
      owner: softika
      name: homebrew-tap
      # A token scoped to the tap alone, rather than reusing the one that
      # publishes the release. The built-in GITHUB_TOKEN cannot write to another
      # repository, and a single personal token with write on both would be able
      # to alter kcac releases just to commit a cask file. This way the token
      # that touches the tap can do nothing else.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/softika/kcac"
    description: "Find out who really has access to your Keycloak realm, and why"
    license: "AGPL-3.0"
    binaries:
      - kcac
    commit_msg_template: "kcac {{ .Tag }}"
    # Homebrew marks cask downloads with com.apple.quarantine, and Go binaries
    # carry only an adhoc linker signature, so macOS refuses to run it:
    # "Apple could not verify kcac is free of malware". spctl reports
    # "rejected". Clearing the flag on the binary we just installed is what the
    # user would otherwise have to do by hand.
    #
    # The honest framing, which the README carries: this binary is not signed
    # with an Apple Developer ID and not notarized. Anyone who would rather
    # verify it themselves can build from source, or check the SHA-256 in
    # checksums.txt against the cask.
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kcac"]

release:
  github:
    owner: softika
    name: kcac
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/softika/kcac/main/install.sh | sh
    ```

    Or with Homebrew, which installs into a directory already on your PATH:

    ```sh
    brew install softika/tap/kcac
    ```

    Every archive is listed in `checksums.txt`, which install.sh verifies.

    kcac only ever reads from Keycloak.
