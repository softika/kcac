name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "*" ]
  # Dependencies go stale between commits, so re-check on a schedule: a new
  # advisory against an unchanged dependency would otherwise go unnoticed.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # Reports only vulnerabilities that are actually reachable from this
      # code, so the signal stays high enough to act on.
      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      # kcac's whole job is handling a Keycloak service-account secret, and the
      # test fixture deliberately contains a well-known one. A scan keeps a real
      # credential from ever joining it unnoticed.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
