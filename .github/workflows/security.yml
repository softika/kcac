name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "*" ]
  # Dependencies go stale between commits, so re-check on a schedule: a new
  # advisory against an unchanged dependency would otherwise go unnoticed.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # Reports only vulnerabilities that are actually reachable from this
      # code, so the signal stays high enough to act on.
      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the point is catching a credential that was committed
          # once and removed later, which a shallow clone hides.
          fetch-depth: 0

      # kcac's whole job is handling a Keycloak service-account secret, and the
      # test fixture deliberately contains a well-known one. A repo used to
      # seeing secrets in it is exactly where a real one slips in unnoticed.
      #
      # This runs the gitleaks CLI, which is MIT licensed and free to use. The
      # gitleaks-action wrapper is not: it requires a paid licence for
      # organisation-owned repositories, and softika is an organisation.
      - name: Scan for committed credentials
        run: make secrets
