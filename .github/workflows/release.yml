name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from git history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # A tag should never turn into a release that does not compile or whose
      # tests fail. Cheap insurance; the Keycloak matrix already ran on main.
      - name: Format, vet and unit tests
        run: make check

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Publishes the release in this repository only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commits the Homebrew cask to softika/homebrew-tap. A fine-grained
          # PAT scoped to that one repository with contents:write, and nothing
          # else. GITHUB_TOKEN cannot reach another repository, and a token with
          # write on both would be able to rewrite kcac releases in order to
          # commit a cask file.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
