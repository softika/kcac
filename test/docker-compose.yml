# Seeded Keycloak for kcac's integration tests.
#
#   docker compose -f test/docker-compose.yml up -d
#   ./test/wait-for-keycloak.sh
#
# KC_VERSION selects the server major, which is how the group-children fallback
# is exercised: 23+ serves GET /groups/{id}/children, earlier versions nest the
# tree in /groups instead.
#
#   KC_VERSION=22.0 docker compose -f test/docker-compose.yml up -d
#
# This realm is a fixture. Its credentials are public by design and must never
# be reused anywhere real.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KC_VERSION:-26.0}
    container_name: kcac-test-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Keycloak 26+ reads KC_BOOTSTRAP_ADMIN_*; earlier majors read
      # KEYCLOAK_ADMIN_*. Both are set so one compose file spans the matrix.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
    ports:
      - "${KC_PORT:-8080}:8080"
    volumes:
      - ../testdata/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # Only started by the "ldap" profile, so the ordinary fixture stays fast:
  #
  #   docker compose -f test/docker-compose.yml --profile ldap up -d
  #
  # Exists to answer one question that documentation does not: when a user is
  # removed from a group in the directory, does Keycloak notice? The answer
  # decides whether an access review built on Keycloak data is still true, and
  # it depends on the group mapper's mode.
  openldap:
    image: osixia/openldap:1.5.0
    container_name: kcac-test-ldap
    profiles: [ldap]
    environment:
      LDAP_ORGANISATION: "kcac test"
      LDAP_DOMAIN: "kcac.test"
      LDAP_ADMIN_PASSWORD: "admin"
    # Loaded at first start only, which is why kc-stop discards the volume.
    volumes:
      - ./ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
    command: ["--copy-service"]
    ports:
      - "${LDAP_PORT:-3890}:389"
